name: Update contribution data

on:
  schedule:
    # Daily at 02:17 UTC.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect GitHub contribution data
        env:
          USERNAME: nos1dot618
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 collector.py

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No contribution changes."
          else
            git commit -m "chore: update contribution data"
            git push
          fi
